name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Windows build tools
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Check release version
        shell: powershell
        run: |
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and version.json differ' }
      - name: Test
        shell: powershell
        run: ./scripts/Test.ps1
      - name: Build
        shell: powershell
        run: ./scripts/Build-Maui.ps1 -OutputDirectory dist
      - name: Test installation and upgrade
        shell: powershell
        run: ./tests/Test-MauiPackage.ps1 -OutputDirectory dist
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Peripheral Battery Monitor $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
